<!doctype html><html><head><meta charset="utf-8"><style>.acrylicShelfWrap {
  --shelf-width: min(554px, 100%);
  --front-height: 78px;
  --acrylic-rgb: 247, 155, 50;
  --acrylic-edge-rgb: 191, 109, 30;
  width: var(--shelf-width);
  position: relative;
  margin: 0 auto;
}

/* North Star palette: alternating warm orange and clear cyan acrylic. */
.acrylicShelfWrap.acrylic-rose { --acrylic-rgb: 247, 155, 50; --acrylic-edge-rgb: 191, 109, 30; }
.acrylicShelfWrap.acrylic-blue { --acrylic-rgb: 45, 157, 232; --acrylic-edge-rgb: 24, 112, 176; }
.acrylicShelfWrap.acrylic-jade { --acrylic-rgb: 74, 171, 115; --acrylic-edge-rgb: 38, 119, 76; }
.acrylicShelfWrap.acrylic-plum { --acrylic-rgb: 165, 117, 207; --acrylic-edge-rgb: 105, 67, 147; }

.acrylicShelf {
  position: relative;
  height: 214px;
  isolation: isolate;
}

.acrylicWallShadow {
  position: absolute;
  left: 4%;
  right: 4%;
  bottom: 7px;
  height: 12px;
  border-radius: 50%;
  background: rgba(22, 25, 28, .16);
  filter: blur(9px);
  transform: translateY(5px);
  opacity: .24;
  pointer-events: none;
}

.acrylicBooks {
  position: absolute;
  left: 17px;
  right: 17px;
  bottom: 16px;
  height: 194px;
  display: flex;
  align-items: flex-end;
  gap: 16px;
  z-index: 3;
  overflow: hidden;
}

.acrylicBook {
  width: var(--book-width, 124px);
  height: var(--book-height, 190px);
  flex: 0 0 auto;
  overflow: hidden;
  border-radius: 1px;
  background: var(--book-color, #d8d6d0);
  box-shadow: 5px 5px 12px rgba(23, 24, 27, .14);
  transform: rotate(var(--book-tilt, 0deg));
  transform-origin: bottom center;
  transition: transform 180ms ease, box-shadow 180ms ease;
  position: relative;
}
.acrylicBook:hover { transform: translateY(-3px); box-shadow: 6px 8px 15px rgba(23,24,27,.18); }
.acrylicBook img { width:100%; height:100%; object-fit:cover; display:block; }
.acrylicBookFallback { height:100%; padding:12px 10px; display:flex; flex-direction:column; justify-content:center; text-align:center; font-family:Georgia,serif; }
.acrylicBookFallback span { margin-top:12px; font:7px/1.2 ui-sans-serif,system-ui,sans-serif; letter-spacing:.12em; text-transform:uppercase; opacity:.65; }

/* A nearly invisible rear rest keeps the physical shelf believable. */
.acrylicBack {
  position:absolute;
  left:10px;
  right:10px;
  bottom:13px;
  height:3px;
  z-index:2;
  border-radius:2px 2px 0 0;
  background:rgba(var(--acrylic-rgb),.34);
  border-top:1px solid rgba(255,255,255,.22);
  pointer-events:none;
}

/* The North Star is a single colored acrylic front rail, not glassmorphism. */
.acrylicFront {
  position:absolute;
  left:4px;
  right:4px;
  bottom:15px;
  height:var(--front-height);
  z-index:6;
  border-radius:7px;
  background:rgba(var(--acrylic-rgb),.76);
  mix-blend-mode:multiply;
  border:1px solid rgba(var(--acrylic-edge-rgb),.40);
  border-top-color:rgba(255,255,255,.34);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.32),
    inset 0 -1px 0 rgba(var(--acrylic-edge-rgb),.14),
    0 2px 5px rgba(22,29,25,.06);
  backdrop-filter:saturate(1.04);
  -webkit-backdrop-filter:saturate(1.04);
  pointer-events:none;
}
.acrylicFront::before {
  content:'';
  position:absolute;
  left:2px;
  right:2px;
  top:1px;
  height:1px;
  border-radius:6px 6px 0 0;
  background:rgba(255,255,255,.30);
  mix-blend-mode:screen;
}

/* One subtle bottom thickness. No stacked fake 3D strips. */
.acrylicBase {
  position:absolute;
  left:7px;
  right:7px;
  bottom:12px;
  height:2px;
  z-index:5;
  border-radius:0 0 4px 4px;
  background:rgba(var(--acrylic-edge-rgb),.40);
  box-shadow:0 2px 5px rgba(35,28,20,.08);
  pointer-events:none;
}
.acrylicBottomEdge { display:none; }
.acrylicSide { display:none; }

/* Reference-matched domed chrome mounting caps. */
.acrylicMount {
  position:absolute;
  bottom:calc(15px + (var(--front-height) / 2) - 7.5px);
  width:15px;
  height:15px;
  z-index:10;
  pointer-events:none;
  filter:drop-shadow(0 1px 1px rgba(30,34,36,.28));
}
.acrylicMountLeft { left:18px; }
.acrylicMountRight { right:18px; }
.acrylicMount::before {
  content:'';
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    radial-gradient(circle at 66% 67%,rgba(255,255,255,.96) 0 10%,rgba(255,255,255,.25) 22%,transparent 23%),
    radial-gradient(circle at 31% 26%,rgba(255,255,255,.92) 0 8%,rgba(255,255,255,.22) 22%,transparent 31%),
    conic-gradient(from 218deg,#8c9296 0 13%,#d8dcde 13% 27%,#747a7e 27% 42%,#eef0f1 42% 59%,#989ea2 59% 73%,#f7f8f9 73% 86%,#858b8f 86% 100%);
  border:1px solid rgba(78,83,87,.44);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.82),inset 0 -1px 1px rgba(44,49,52,.18),0 1px 2px rgba(22,26,28,.22);
}
.acrylicMount::after {
  content:'';
  position:absolute;
  inset:3px;
  border-radius:50%;
  background:linear-gradient(135deg,rgba(92,98,102,.78) 0 33%,rgba(192,196,198,.66) 34% 55%,rgba(250,251,251,.78) 56% 72%,rgba(102,108,112,.62) 73% 100%);
  opacity:.64;
  filter:blur(.25px);
}
.acrylicBookEdit { z-index:12; }

@media (max-width:700px) {
  .acrylicShelfWrap { width:min(var(--shelf-width),100%); }
  .acrylicShelf { height:174px; }
  .acrylicBooks { left:13px; right:13px; bottom:13px; height:159px; gap:12px; }
  .acrylicBook { width:min(var(--book-width,96px),96px); height:min(var(--book-height,148px),148px); }
  .acrylicFront { left:3px; right:3px; bottom:12px; border-radius:6px; }
  .acrylicBack { left:7px; right:7px; bottom:10px; }
  .acrylicBase { left:5px; right:5px; bottom:10px; height:1px; }
  .acrylicMount { bottom:calc(12px + (var(--front-height) / 2) - 7px); width:14px; height:14px; }
  .acrylicMountLeft { left:15px; }
  .acrylicMountRight { right:15px; }
  .acrylicMount::after { inset:4px; }
}

*{box-sizing:border-box}body{margin:0;background:#f4f4f1;font-family:Arial,sans-serif}.stage{width:900px;height:650px;display:grid;place-items:center}.acrylicShelfWrap{--shelf-width:554px;--front-height:78px;--acrylic-rgb:247,155,50;--acrylic-edge-rgb:191,109,30}.acrylicBook{display:grid;place-items:center;text-align:center;font:700 20px Georgia}.acrylicBook:nth-child(1){background:#f5f2ea}.acrylicBook:nth-child(2){background:#f44c1d}.acrylicBook:nth-child(3){background:#f1cf3e}.acrylicBook:nth-child(4){background:#fafafa}.acrylicBook small{display:block;font:9px Arial;margin-top:8px;opacity:.55}</style></head><body><div class="stage"><div class="acrylicShelfWrap"><div class="acrylicWallShadow"></div><div class="acrylicShelf"><div class="acrylicBack"></div><div class="acrylicBooks"><div class="acrylicBook" style="--book-width:124px;--book-height:190px">BAUHAUS<small>TASCHEN</small></div><div class="acrylicBook" style="--book-width:124px;--book-height:190px">objects<br>matter</div><div class="acrylicBook" style="--book-width:124px;--book-height:190px">THE DESIGN<br>OF EVERYDAY<br>THINGS</div><div class="acrylicBook" style="--book-width:124px;--book-height:190px">SOLVING<br>PROBLEMS</div></div><div class="acrylicFront"></div><div class="acrylicBase"></div><div class="acrylicBottomEdge"></div><div class="acrylicMount acrylicMountLeft"></div><div class="acrylicMount acrylicMountRight"></div></div></div></div></body></html>
