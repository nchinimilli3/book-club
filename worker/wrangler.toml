name = "book-club-api"
main = "index.js"
compatibility_date = "2026-08-01"

[triggers]
crons = ["*/15 * * * *"]

# -------------------------------------------------------------------
# BOOK CLUB Worker configuration
#
# Most of the values below are already stored as Worker secrets
# through:
#
#   npx wrangler secret put NAME
#
# Do NOT paste secret values directly into this file.
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Non-secret production variables
#
# You can either:
# 1. keep these as Worker secrets too, which is what you have already
#    been doing, or
# 2. uncomment [vars] and put non-sensitive values here.
#
# Since your existing Worker is already working with them as secrets,
# you do NOT need to move them right now.
# -------------------------------------------------------------------

# [vars]
#
# APP_ORIGIN = "https://book-club-cog.pages.dev"
# SUPABASE_URL = "https://srcggpqxhigqfxgvoskx.supabase.co"
# GOOGLE_REDIRECT_URI = "https://book-club-api.postgradplans.workers.dev/api/calendar/callback"
# OPENAI_MODEL = "YOUR_MODEL_NAME"

# -------------------------------------------------------------------
# Current Worker secrets
#
# These should be configured with:
#
#   npx wrangler secret put NAME
#
# -------------------------------------------------------------------

# Core / Supabase
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# SUPABASE_URL
# APP_ORIGIN

# NYT Books
# NYT_BOOKS_API_KEY

# Google Vision OCR
# GOOGLE_VISION_API_KEY

# OpenAI
# OPENAI_API_KEY
# OPENAI_MODEL

# Google Calendar OAuth
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# GOOGLE_REDIRECT_URI
# CALENDAR_STATE_SECRET
# TOKEN_ENCRYPTION_KEY

# -------------------------------------------------------------------
# Optional future enrichment
# -------------------------------------------------------------------

# Optional self-hosted Goodreads cover service (the attached Go API).
# GOODREADS_COVER_API_URL should point to its public base URL.

# TMDB_BEARER_TOKEN
# YOUTUBE_API_KEY

# -------------------------------------------------------------------
# Cron
#
# Runs every 15 minutes.
# The Worker scheduled() handler will use this to:
#
# - create upcoming meeting reminders
# - create reading checkpoint reminders
# - later send web push notifications
#
# -------------------------------------------------------------------
