name = "book-club-api-next"
main = "src/index.ts"
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat"]

# Separate preview backend: do not replace the existing production Worker until
# preview acceptance has passed. Replace only this placeholder after D1 exists.
[[d1_databases]]
binding = "DB"
database_name = "book-club-preview"
database_id = "04b582fe-0b63-4478-a121-0f7b664aa98a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "book-club-preview-media"

[vars]
APP_ORIGIN = "https://book-club-cog.pages.dev"
# Explicit production plus the current Pages preview URL. Keep this list exact;
# do not use a wildcard for credentialed auth requests.
APP_ALLOWED_ORIGINS = "https://cfb665b8.book-club-cog.pages.dev"
AUTH_BASE_URL = "https://book-club-api-next.postgradplans.workers.dev"
RESEND_FROM = "BOOK CLUB <hello@example.com>"
AUTH_EMAIL_MODE = "mailjet"
MAILJET_FROM_EMAIL = "nchinimilli5@gmail.com"
MAILJET_FROM_NAME = "BOOK CLUB"
# This value is deliberately capped again in code; increasing this file cannot
# accidentally turn the 500 MB safety limit into a larger billable allowance.
R2_MAX_STORAGE_BYTES = "524288000"

[triggers]
crons = ["*/15 * * * *"]

# Set these with `wrangler secret put`, never in this file:
# BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, RESEND_API_KEY,
# MAILJET_API_KEY, MAILJET_SECRET_KEY,
# TURNSTILE_SECRET_KEY, OPENAI_API_KEY, NYT_BOOKS_API_KEY,
# GOOGLE_VISION_API_KEY, CALENDAR_STATE_SECRET, TOKEN_ENCRYPTION_KEY
